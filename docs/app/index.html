<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Index birmovanca</title>
<meta name="theme-color" content="#8a2646">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Index">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="app.css">
<style>
/* Jednostĺpcová mobilná aplikácia: bordový pás s hlavičkou, zoznam, dolné záložky, spodné okná na zadávanie. */
:root{
  --bg:#f6f2f1; --surface:#fffdfc; --fg:#2a1a20; --muted:#74636a; --line:#e3d8da;
  --accent:#8a2646; --accent-ink:#ffffff; --accent-soft:#f1e0e5;
  --head-bg:#8a2646; --head-fg:#ffffff; --head-muted:#f0d3dc; --gold:#c9a15a;
  --ok:#2d6a4a; --ok-soft:#dcebe2; --warn:#8f5f12; --warn-soft:#f6e8cc; --miss:#a2332f; --miss-soft:#f6dedc;
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#181214; --surface:#231a1d; --fg:#f1e7ea; --muted:#a8979d; --line:#3a2e33;
    --accent:#e08aa3; --accent-ink:#2a0f19; --accent-soft:#3a2229;
    --head-bg:#5c1b31; --head-fg:#fbeef2; --head-muted:#e2bcc8; --gold:#d1a352;
    --ok:#7cc59c; --ok-soft:#1f3328; --warn:#e0b25a; --warn-soft:#3a2d14; --miss:#f08a85; --miss-soft:#3b2120;
    color-scheme:dark;
  }
}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
@supports (-webkit-touch-callout:none){input,select,textarea{font-size:16px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--sab))}
header.top{background:var(--head-bg);color:var(--head-fg);padding:calc(16px + var(--sat)) 16px 14px}
.top .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--head-muted);display:flex;justify-content:space-between;gap:8px}
.top h1{font-variant-numeric:lining-nums;font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;margin:4px 0 0;letter-spacing:.02em;text-wrap:balance}
.top .who{margin-top:6px;font-size:14px;color:var(--head-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .who b{color:var(--head-fg);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid color-mix(in srgb,var(--head-fg) 28%,transparent);border-radius:10px;padding:8px 10px;min-width:0}
.stat .n{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;line-height:1.1}
.stat .n small{font-size:12px;font-weight:500;color:var(--head-muted)}
.stat .l{font-size:11px;color:var(--head-muted);margin-top:2px}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--head-fg) 22%,transparent);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
main{padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}
.pending{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.pending .btn{flex:none}
.warnbox{background:var(--miss-soft);color:var(--miss);border-radius:12px;padding:10px 14px;font-size:13px}
.infobox{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13px}
h2.sec{font-family:var(--font-display);font-size:24px;line-height:1.1;margin:0;font-weight:700}
p.hint{margin:0;color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.month{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -4px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row.noicon{grid-template-columns:minmax(0,1fr) auto}
.row[disabled]{opacity:.55;cursor:default}
.row.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.date{text-align:center;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.date b{display:block;font-family:var(--font-display);font-size:30px;font-weight:700}
.date span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.info{min-width:0}
.info .t{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.info .s{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.miss{background:var(--miss-soft);color:var(--miss)}
.chip.none{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.danger{background:transparent;border-color:var(--miss);color:var(--miss)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.wide{width:100%;display:block}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card b{font-weight:600}
.gift{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.gift input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.gift label{flex:1;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));z-index:5}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
nav.tabs button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px;min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--miss);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
#ov{position:fixed;inset:0;background:rgba(20,8,12,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--sab));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--font-display);font-size:26px;line-height:1.1;margin:0;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lab{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field textarea{min-height:100px;resize:vertical}
.err{color:var(--miss);font-size:13px;min-height:1em}
.okmsg{color:var(--ok);font-size:13px}
.sel{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.sel label{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px;font-size:13.5px}
.sel input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1/1;max-height:52vh;width:100%;margin:0 auto}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox i{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
.bigok{font-family:var(--font-display);font-size:30px;line-height:1.1;color:var(--ok);margin:0}
.qrimg{background:#fff;border-radius:12px;padding:10px;align-self:center;width:min(280px,100%);height:auto}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--bg);border-radius:10px;padding:10px;user-select:all}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.toggle{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px;font-size:13.5px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.hero{padding:calc(40px + var(--sat)) 20px 24px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;min-height:100vh}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1.05;margin:6px 0 0;color:var(--accent)}
.hero .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero .btn{padding:14px 16px;font-size:15px}
/* chat */
.chatbox{display:flex;flex-direction:column;gap:6px;min-height:200px}
.msg{max-width:86%;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;align-self:flex-start;text-align:left;font-size:14px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--accent-soft);border-radius:14px 14px 4px 14px;border-color:transparent}
.msg .who{font-size:11.5px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.msg .when{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + var(--sab));background:var(--bg);border-top:1px solid var(--line);padding:8px 12px;z-index:4}
.composer div{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 14px;resize:none;max-height:110px;min-height:42px}
.composer .btn{border-radius:18px}
.docrow{display:flex;gap:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="app.js"></script>
</body>
</html>
