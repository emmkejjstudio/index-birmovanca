name: Zostaviť aplikáciu
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozbaliť projekt
        run: mkdir proj && unzip -q projekt.zip -d proj
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proj/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Nainštalovať balíky
        working-directory: proj
        run: npm ci
      - name: Zbaliť webovú časť
        working-directory: proj
        run: npm run build
      - name: Preniesť do Androidu
        working-directory: proj
        run: npx cap sync android
      - name: Pripraviť podpisový kľúč
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; fi
      - name: Zostaviť ladiacu APK a release AAB
        working-directory: proj/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: index-birmovanca-ladiaca-apk
          path: proj/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: index-birmovanca-release-aab
          path: proj/android/app/build/outputs/bundle/release/*.aab
