name: Vytvoriť podpisový kľúč (len raz)
on:
  workflow_dispatch:
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Vytvoriť kľúč
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -alias indexbirmovanca -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Emmkejj Studio, O=Emmkejj Studio, C=SK"
          base64 -w0 release.jks > release.jks.b64
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=indexbirmovanca\n' "$PASS" "$PASS" > hesla.txt
      - uses: actions/upload-artifact@v4
        with:
          name: podpisovy-kluc-ZALOHUJ-A-ZMAZ
          path: |
            release.jks
            release.jks.b64
            hesla.txt
          retention-days: 1
